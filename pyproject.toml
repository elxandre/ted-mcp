[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ted-mcp"
version = "0.1.0"
description = "Read-only MCP server for EU public tenders (TED Search API v3)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.2,<3",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
ted-mcp = "ted_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["ted_mcp"]
